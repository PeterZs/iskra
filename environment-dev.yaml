name: iskra
channels:
  - conda-forge
dependencies:
  - ninja
  - pip
  - pip:
      # Linters:
      - ruff
      - nvtx
      # Visualization
      - matplotlib
      - jupyterlab
      - ipywidgets
      - widgetsnbextension
      - ipympl
      # Testing:
      - pytest
      - pytest-cases
      - pytest-cov
      # Documentation
      # Pin Sphinx stack: shape_tooltips + Napoleon Returns monkeypatch must be
      # re-checked when upgrading these packages.
      - sphinx==9.1.0
      - pydata-sphinx-theme==0.20.0
      - myst-parser==5.1.0
      - sphinx-design==0.7.0
      - sphinx-copybutton==0.5.2
      - sphinx-external-toc==1.1.0
      - sphinx-autobuild==2025.8.25
      - sphinx_github_style==1.2.2
      - sphinx-math-dollar==1.3
      # Deployment
      - nanobind>=2.5.0
      - scikit-build-core>=0.10.7
      - pyproject-metadata
      - setuptools
      - twine>=1.11.0
      - wheel
      - packaging
